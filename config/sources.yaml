# ============================================================================
# TDDG Monthly Bulletin - Source Inventory
# ----------------------------------------------------------------------------
# Each entry MUST include:
#   id          unique snake_case identifier
#   name        human-readable source name
#   url         feed URL (for type=rss) or landing page (for type=html)
#   type        rss | html
#   category    one or more of: doctrine, simulation, lvc, learning,
#               leadership, analytics, infrastructure, general_military
#   language    ISO 639-1, default en
#   enabled     true | false
#   notes       free text - why we monitor, known caveats, alt feeds
#
# Add new sources at the bottom. Keep IDs stable - downstream dedupe and
# analytics keys off them. Verify URLs periodically; .feed/ paths drift.
# Only open-source / publicly accessible material - no paywalls or auth.
# ============================================================================

sources:

  # -- US Army TRADOC ecosystem -------------------------------------------------

  - id: mad_scientist_lab
    name: Mad Scientist Laboratory (TRADOC G-2)
    url: https://madsciblog.tradoc.army.mil/feed/
    type: rss
    category: [doctrine, simulation, general_military]
    language: en
    enabled: true
    notes: TRADOC's flagship futures blog. High signal on operational environment, character of war, emerging tech.

  - id: army_university_press_review
    name: Army University Press - Military Review
    url: https://www.armyupress.army.mil/Journals/Military-Review/
    type: html
    category: [doctrine, leadership]
    language: en
    enabled: true
    notes: Premier US Army professional journal. No public RSS - scrape new-article links from landing page.

  - id: nco_journal
    name: NCO Journal (Army University Press)
    url: https://www.armyupress.army.mil/Journals/NCO-Journal/
    type: html
    category: [leadership, learning]
    language: en
    enabled: true
    notes: NCO development and training perspectives. HTML scrape.

  - id: call_publications
    name: Center for Army Lessons Learned (CALL)
    url: https://api.army.mil/e2/c/downloads/
    type: html
    category: [doctrine, learning, analytics]
    language: en
    enabled: true
    notes: After-action and observation reports. Many PDFs - parse landing pages, not the PDFs themselves at fetch time.

  # -- US Joint / DoD ----------------------------------------------------------

  - id: joint_force_quarterly
    name: Joint Force Quarterly (NDU Press)
    url: https://ndupress.ndu.edu/JFQ/
    type: html
    category: [doctrine, leadership]
    language: en
    enabled: true
    notes: Joint-level professional journal. Quarterly cadence - low frequency, high quality.

  - id: marine_corps_gazette
    name: Marine Corps Gazette
    url: https://mca-marines.org/gazette/
    type: html
    category: [doctrine, leadership]
    language: en
    enabled: true
    notes: USMC professional journal. Some content paywalled - filter for open articles only.

  - id: usni_proceedings
    name: USNI Proceedings (US Naval Institute)
    url: https://www.usni.org/magazines/proceedings
    type: html
    category: [doctrine, leadership, general_military]
    language: en
    enabled: true
    notes: Includes naval/marine training and education content. Some paywalled - take open content only.

  - id: diu_news
    name: Defense Innovation Unit (DIU) news
    url: https://www.diu.mil/latest
    type: html
    category: [simulation, infrastructure]
    language: en
    enabled: true
    notes: Procurement and prototyping signals for training tech.

  - id: darpa_news
    name: DARPA news
    url: https://www.darpa.mil/news
    type: html
    category: [simulation, infrastructure, analytics]
    language: en
    enabled: true
    notes: Forward research signals - cognitive science, AR/VR, autonomy with training implications.

  # -- US think tanks ----------------------------------------------------------

  - id: modern_war_institute
    name: Modern War Institute at West Point
    url: https://mwi.westpoint.edu/feed/
    type: rss
    category: [doctrine, leadership, general_military]
    language: en
    enabled: true
    notes: Officer-led commentary on modern warfare. Strong on irregular warfare and tactical doctrine.

  - id: war_on_the_rocks
    name: War on the Rocks
    url: https://warontherocks.com/feed/
    type: rss
    category: [doctrine, general_military]
    language: en
    enabled: true
    notes: Mixed quality but consistently relevant. Filter aggressively at the relevance step.

  - id: small_wars_journal
    name: Small Wars Journal
    url: https://smallwarsjournal.com/rss.xml
    type: rss
    category: [doctrine, general_military]
    language: en
    enabled: true
    notes: Practitioner-oriented. Irregular cadence.

  - id: rand_arroyo
    name: RAND Arroyo Center publications
    url: https://www.rand.org/ard/publications.html
    type: html
    category: [doctrine, analytics, general_military]
    language: en
    enabled: true
    notes: Army-focused RAND research. Long reports - extract titles + abstracts at fetch.

  - id: csis_defense
    name: CSIS - International Security Program
    url: https://www.csis.org/programs/international-security-program
    type: html
    category: [doctrine, general_military]
    language: en
    enabled: true
    notes: Strategic-level analysis. Filter for training/force-development pieces.

  - id: cnas
    name: Center for a New American Security (CNAS)
    url: https://www.cnas.org/rss
    type: rss
    category: [doctrine, general_military]
    language: en
    enabled: true
    notes: Defense policy think tank with strong tech/training crossover.

  - id: atlantic_council_scowcroft
    name: Atlantic Council - Scowcroft Center
    url: https://www.atlanticcouncil.org/programs/scowcroft-center-for-strategy-and-security/
    type: html
    category: [doctrine, general_military]
    language: en
    enabled: true
    notes: Defense and security commentary. Selective relevance.

  - id: hudson_defense
    name: Hudson Institute - National Security
    url: https://www.hudson.org/topics/national-security-defense
    type: html
    category: [doctrine, general_military]
    language: en
    enabled: true
    notes: Conservative defense think tank. HTML landing page.

  - id: ida
    name: Institute for Defense Analyses (IDA)
    url: https://www.ida.org/research-and-publications
    type: html
    category: [doctrine, analytics, general_military]
    language: en
    enabled: true
    notes: FFRDC research. Many reports limited to abstracts publicly.

  # -- UK -------------------------------------------------------------------

  - id: wavell_room
    name: Wavell Room (UK)
    url: https://wavellroom.com/feed/
    type: rss
    category: [doctrine, leadership, general_military]
    language: en
    enabled: true
    notes: British army-focused practitioner site. Excellent on PME and training reform debates.

  - id: rusi
    name: RUSI - Royal United Services Institute
    url: https://www.rusi.org/rss/all-content
    type: rss
    category: [doctrine, general_military]
    language: en
    enabled: true
    notes: UK defense and security think tank. Strong land warfare and lessons-learned commentary.

  # -- Australia ------------------------------------------------------------

  - id: the_cove
    name: The Cove (Australian Army)
    url: https://cove.army.gov.au/
    type: html
    category: [doctrine, learning, leadership]
    language: en
    enabled: true
