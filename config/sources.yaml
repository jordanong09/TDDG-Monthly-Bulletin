# ============================================================================
# TDDG Monthly Bulletin - Source Inventory
# ----------------------------------------------------------------------------
# Active source list (10 sources, expanded May 2026).
#
# Each source has a primary use mapped to one or two TDDG branches.
# Categories are deliberately narrow so the pre-filter's +0.15 category
# boost lines up cleanly with the source's intended contribution.
#
# Source              Primary use                                     Branches
# ------------------  ---------------------------------------------   -----------
# war_on_the_rocks    Doctrine / leadership / strategic adaptation    6, 5
# defense_one         AI / analytics / innovation                     3, 1
# rusi                Operational lessons / transformation            6, 4
# army_technology     Infrastructure / LVC / systems                  2, 1
# modern_war_inst.    Leadership / PME / tactical learning            5, 4, 1
# breaking_defense    Defence trade press; training & sim coverage    1, 2
# nato_act            NATO transformation, doctrine, exercises        1, 3, 6
# rand_arroyo         Army-focused research (RAND Arroyo Center)      3, 6
# csis_defense        Strategy, security policy, force structure      5, 6
# lieber_institute    Law of armed conflict; doctrine and ethics      5, 6
#
# Branch reference:
#   1 = Cap Dev (Simulation)        4 = Learning Systems
#   2 = Cap Dev (Land/Infra)        5 = Leadership Development
#   3 = Training Analytics          6 = Doctrine Development
#
# Other sources remain in the file below with enabled: false. Flip to true
# to re-enable.
# ============================================================================

sources:

  # ===== ACTIVE SOURCES (10) =================================================

  - id: war_on_the_rocks
    name: War on the Rocks
    url: https://warontherocks.com/feed/
    type: rss
    category: [doctrine, leadership]
    language: en
    enabled: true
    notes: |
      Primary mapping to Branch 6 (Doctrine Development) and Branch 5
      (Leadership Development). Practitioner commentary on training reform,
      PME, and doctrinal change. Filter aggressively - the feed covers more
      than training-futures topics.

  - id: defense_one
    name: Defense One
    url: https://www.defenseone.com/rss/all/
    type: rss
    category: [analytics, simulation]
    language: en
    enabled: true
    notes: |
      Primary mapping to Branch 3 (Training Analytics) and Branch 1
      (Cap Dev Sim). AI for training and decision support, command and
      control modernisation, autonomous systems. Subset feeds at
      /rss/defense-systems/ and /rss/technology/ if all/ is too noisy.

  - id: rusi
    name: RUSI - Royal United Services Institute
    url: https://www.rusi.org/rss/all-content
    type: rss
    category: [doctrine, learning]
    language: en
    enabled: true
    notes: |
      Primary mapping to Branch 6 (Doctrine Development) and Branch 4
      (Learning Systems). Operational lessons and military transformation
      with strong work on training pedagogy and instructor development.

  - id: army_technology
    name: Army Technology
    url: https://www.army-technology.com/feed/
    type: rss
    category: [infrastructure, simulation]
    language: en
    enabled: true
    notes: |
      Primary mapping to Branch 2 (Cap Dev Land/Infra) and Branch 1
      (Cap Dev Sim). Trade publication covering training infrastructure,
      LVC systems, synthetic environments, simulators, contractor
      solutions. Treat vendor coverage as marketing claims unless
      independently corroborated.

  - id: modern_war_institute
    name: Modern War Institute at West Point
    url: https://mwi.westpoint.edu/feed/
    type: rss
    category: [leadership, learning]
    language: en
    enabled: true
    notes: |
      Primary mapping to Branch 5 (Leadership Development) and Branch 4
      (Learning Systems). Officer-led commentary on modern warfare, leader
      development, tactical innovation.

  - id: breaking_defense
    name: Breaking Defense
    url: https://breakingdefense.com/feed/
    type: rss
    category: [simulation, infrastructure]
    language: en
    enabled: true
    notes: |
      Primary mapping to Branch 1 (Cap Dev Sim) and Branch 2 (Cap Dev
      Land/Infra). Defence trade press. Useful for early signals on
      training devices, range modernisation, programme milestones.
      Filter aggressively - much of the feed is procurement noise.

  - id: nato_act
    name: NATO Allied Command Transformation
    url: https://www.act.nato.int/articles/
    type: html
    category: [doctrine, simulation]
    language: en
    enabled: true
    notes: |
      Primary mapping to Branch 6 (Doctrine Development), Branch 1
      (Cap Dev Sim), and Branch 3 (Training Analytics). NATO's
      transformation HQ - training, exercises, future force concepts,
      multi-domain operations doctrine. HTML scrape; needs a selector in
      config/html_selectors.yaml before collect.py picks it up.

  - id: rand_arroyo
    name: RAND Arroyo Center
    url: https://www.rand.org/ard/publications.html
    type: html
    category: [analytics, doctrine]
    language: en
    enabled: true
    notes: |
      Primary mapping to Branch 3 (Training Analytics) and Branch 6
      (Doctrine Development). RAND's army-focused research arm. Reports
      tend to be substantive and well-grounded. HTML scrape; needs a
      selector in config/html_selectors.yaml.

  - id: csis_defense
    name: CSIS - International Security Program
    url: https://www.csis.org/programs/international-security-program
    type: html
    category: [doctrine, leadership]
    language: en
    enabled: true
    notes: |
      Primary mapping to Branch 6 (Doctrine Development) and Branch 5
      (Leadership Development). Strategy and security policy analysis;
      strong on force structure and great-power competition framing.
      HTML scrape; needs a selector in config/html_selectors.yaml.

  - id: lieber_institute
    name: Lieber Institute West Point (Articles of War)
    url: https://lieber.westpoint.edu/feed/
    type: rss
    category: [doctrine, leadership]
    language: en
    enabled: true
    notes: |
      Primary mapping to Branch 6 (Doctrine Development) and Branch 5
      (Leadership Development). Law of armed conflict, military ethics,
      and doctrine analysis from West Point's Lieber Institute. Articles
      of War is the main publication channel. RSS via WordPress; verify
      feed URL on first run.

