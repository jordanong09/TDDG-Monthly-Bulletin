# ============================================================================
# TDDG Monthly Bulletin - Source Inventory
# ----------------------------------------------------------------------------
# Focused source list (May 2026 pilot configuration).
#
# Each source has a primary use mapped to one or two branches. Categories
# are deliberately narrow so the pre-filter's +0.15 category boost lines
# up cleanly with the source's intended contribution.
#
# Source            Primary use                                  Maps to branches
# ----------------  -------------------------------------------  ----------------
# war_on_the_rocks  Doctrine / leadership / strategic adaptation  1, 5
# defense_one       AI / analytics / innovation                   2, 6
# rusi              Operational lessons / transformation          1, 4
# army_technology   Infrastructure / LVC / systems                3, 6
# modern_war_inst.  Leadership / PME / tactical learning          5, 4, 1
#
# To re-enable a source from the disabled list, change its enabled: false
# to enabled: true. The script will pick it up on the next run.
# ============================================================================

sources:

  # ===== FOCUSED SOURCES (active) ============================================

  - id: war_on_the_rocks
    name: War on the Rocks
    url: https://warontherocks.com/feed/
    type: rss
    category: [doctrine, leadership]
    language: en
    enabled: true
    notes: |
      Doctrine, leadership, and strategic adaptation. Articles often surface
      from serving and recently-retired officers writing about training
      reform, PME, and doctrinal change. Filter aggressively at relevance
      step - the feed covers more than training-futures topics.

  - id: defense_one
    name: Defense One
    url: https://www.defenseone.com/rss/all/
    type: rss
    category: [simulation, analytics]
    language: en
    enabled: true
    notes: |
      AI, analytics, and innovation in defence. Most relevant items: AI for
      training and decision support, defence data, command and control
      modernisation, autonomous systems. Subset feeds available at
      /rss/defense-systems/ and /rss/technology/ if all/ is too noisy.

  - id: rusi
    name: RUSI - Royal United Services Institute
    url: https://www.rusi.org/rss/all-content
    type: rss
    category: [doctrine, learning]
    language: en
    enabled: true
    notes: |
      Operational lessons and military transformation, with strong work on
      training pedagogy and individualised training pathways. UK perspective
      but generalisable to TDDG concerns.

  - id: army_technology
    name: Army Technology
    url: https://www.army-technology.com/feed/
    type: rss
    category: [infrastructure, lvc]
    language: en
    enabled: true
    notes: |
      Trade publication covering training infrastructure, LVC systems,
      synthetic environments, simulators, and contractor solutions. Treat
      vendor coverage as marketing claims unless independently corroborated.

  - id: modern_war_institute
    name: Modern War Institute at West Point
    url: https://mwi.westpoint.edu/feed/
    type: rss
    category: [leadership, learning, doctrine]
    language: en
    enabled: true
    notes: |
      Leadership, PME, and tactical learning. Officer-led commentary on
      modern warfare. Strong on leader development, tactical innovation,
      and the relationship between PME and operational effectiveness.

  # ===== DISABLED (kept for future re-enablement) ============================
  # Re-enable by flipping enabled: false -> enabled: true.

