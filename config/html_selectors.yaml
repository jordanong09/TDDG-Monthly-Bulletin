# ============================================================================
# HTML selectors for non-RSS sources
# ----------------------------------------------------------------------------
# Each key is a source `id` from sources.yaml (only needed for type: html).
# Each entry holds three CSS selectors:
#
#   article_link     selector for <a> elements pointing at article pages.
#                    Must select the link itself - the script reads its href.
#   title            (optional) selector relative to the link's PARENT for
#                    a richer title element. Falls back to the link's own
#                    text if blank.
#   published_date   (optional) selector relative to the link's PARENT for
#                    a date element. Script prefers a `datetime=...` attr
#                    (HTML <time>) over the visible text.
#
# Leave any field null until you have inspected the page DOM yourself.
# A source with no `article_link` selector is skipped with a warning.
#
# How to fill these in (one-time per source, ~5 min each):
#   1. Open the source URL in a browser.
#   2. Right-click an article link in the list -> Inspect.
#   3. Find a selector that uniquely matches article links and nothing else
#      (e.g. `h2.entry-title a`, `.views-row .field-content a`,
#      `article header a`). Test in DevTools console:
#         document.querySelectorAll("YOUR_SELECTOR").length
#      Should match the number of articles on the page.
#   4. Paste into article_link below. Repeat for title/date if needed.
#   5. Re-run scripts/collect.py and check the per-source count in the log.
#
# Tip: many sites are WordPress (selectors like `.entry-title a`) or Drupal
# (selectors like `.views-row a` or `.field--name-title a`). Try those first.
# ============================================================================

