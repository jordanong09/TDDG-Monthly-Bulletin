# ============================================================================
# TDDG Branches - structure used by the analyse + render stages
# ----------------------------------------------------------------------------
# Each branch maps incoming articles to the branch most likely to care about
# them, and supplies the keyword vocabulary that the filter + analyse prompts
# bias against.
#
# Keep keywords rich: include the expansive phrase ("synthetic training
# environment") AND the acronym ("STE"). Mix US, UK, AU, and NATO terminology
# where the concept exists in multiple traditions.
#
# Branch IDs are stable and used as JSON keys downstream. Renaming `name`
# is fine; renaming `id` will break stored data.
# ============================================================================

branches:

  - id: 1
    name: Doctrine & Concepts
    primary_categories: [doctrine]
    focus_areas:
      - Future training doctrine
      - Concept development and capstone concepts
      - Doctrinal alignment with new warfighting concepts (MDO, JADC2, LSCO)
      - Force design and training implications
      - Doctrine writing process and rapid update cycles
    core_question: >
      How should our training doctrine evolve to prepare formations for
      multi-domain, large-scale combat operations against peer adversaries?
    keywords:
      - doctrine
      - training doctrine
      - doctrinal update
      - capstone concept
      - concept of operations
      - concept paper
      - warfighting concept
      - multi-domain operations
      - MDO
      - large-scale combat operations
      - LSCO
      - joint all-domain command and control
      - JADC2
      - future force
      - force design
      - FM 7-0
      - ADP 7-0
      - JCIDS
      - joint warfighting concept
      - training transformation
      - training and education concept
      - doctrine 2.0
      - rapid doctrine
      - agentic warfare
      - agentic AI
      - manned-unmanned teaming
      - MUM-T
      - continuous transformation

