# ============================================================================
# TDDG Branches - Singapore Armed Forces (SAF) Training Development & Doctrine Group
# ----------------------------------------------------------------------------
# Six branches inside TDDG, HQ Training and Doctrine (Singapore Army / SAF).
# Each branch's focus_areas, core_question, and keywords drive how the
# pre-filter scores articles and how the LLM analyst frames implications.
#
# Branch IDs are stable and used as JSON keys downstream. Renaming `name`
# is fine; renaming `id` will break stored data.
# ============================================================================

branches:

  - id: 1
    name: Cap Dev (Simulation)
    primary_categories: [simulation, lvc]
    focus_areas:
      - Live, virtual, and constructive (LVC) simulation integration for SAF Army
      - Embedding AI inside simulation systems to improve learning fidelity
      - Cross-learning across heterogeneous simulation systems (data, scenarios, scoring)
      - Synthetic training environments, VR/AR/XR, serious games
      - Simulator acquisition, design, and lifecycle
    core_question: >
      How can SAF integrate live, virtual, and constructive simulation
      systems, embed AI within them, and enable cross-learning between
      systems so that simulation-based training accelerates force readiness?
    keywords:
      - simulation
      - simulator
      - LVC
      - live virtual constructive
      - LVC integration
      - synthetic training environment
      - STE
      - synthetic training
      - virtual reality
      - VR
      - augmented reality
      - AR
      - mixed reality
      - XR
      - immersive training
      - serious games
      - game-based learning
      - GBL
      - constructive simulation
      - federated simulation
      - HLA
      - DIS
      - TENA
      - common synthetic environment
      - synthetic terrain
      - digital twin
      - AI in simulation
      - AI-driven scenario
      - AI-enabled targeting
      - AI-enabled operating system
      - agentic AI
      - cross-platform simulation
      - I/ITSEC
      - manned-unmanned teaming
      - MUM-T

  - id: 2
    name: Cap Dev (Land/Infrastructure)
    primary_categories: [infrastructure, lvc]
    focus_areas:
      - SAFTI City (instrumented urban training facility, operational from Oct 2024)
      - Multi-Mission Range Complex (MMRC, MMRC 2 announced Feb 2026, operational by 2031)
      - Live training range modernisation and instrumentation
      - Training facility design (urban, MOUT, ranges, subterranean)
      - Smart-sensor and Video Targetry System (VTS) instrumentation
      - Physical infrastructure that supports manned-unmanned teaming training
    core_question: >
      What live and physical training infrastructure does SAF need to
      develop, modernise, and instrument so that ground training keeps
      pace with the operational tasks soldiers must master?
    keywords:
      - SAFTI City
      - MMRC
      - MMRC 2
      - Multi-Mission Range Complex
      - live firing range
      - indoor live firing
      - urban training facility
      - MOUT
